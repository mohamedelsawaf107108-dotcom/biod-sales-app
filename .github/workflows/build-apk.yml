name: Build BIO-D APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - BIO-D-Android.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: bio-d-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive_path = Path("BIO-D-Android.zip")
          if not archive_path.is_file():
              raise FileNotFoundError(
                  "Upload BIO-D-Android.zip to the repository root"
              )

          root = Path("android").resolve()
          root.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive_path) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError("Invalid archive path")

              archive.extractall(root)

          required_files = [
              "settings.gradle",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/assets/www/index.html",
              "app/src/main/assets/www/app.js",
          ]

          for name in required_files:
              if not (root / name).is_file():
                  raise FileNotFoundError(name)

          print("Android project extracted successfully")
          PY

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            apk/BIO-D-Sales.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIO-D-Sales-APK
          path: apk/BIO-D-Sales.apk
          if-no-files-found: error
