name: Build BIO-D APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - BIO-D-Android.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: bio-d-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          source = Path("BIO-D-Android.zip")
          if not source.is_file():
              raise FileNotFoundError("Upload BIO-D-Android.zip first")

          root = Path("android").resolve()
          root.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(source) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError("Invalid archive path")
              archive.extractall(root)

          if not (root / "app/build.gradle").is_file():
              raise FileNotFoundError("Android project is missing")
          PY

      - name: Prepare permanent signing key
        env:
          SIGNING_SECRET: ${{ secrets.BIO_D_SIGNING }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          from pathlib import Path

          raw = os.environ.get("SIGNING_SECRET", "")
          if not raw:
              raise RuntimeError("Add BIO_D_SIGNING in GitHub Secrets first")

          data = json.loads(raw)
          password = data["password"]
          if "\n" in password or "\r" in password:
              raise ValueError("Invalid password format")
          if data["alias"] != "biod":
              raise ValueError("Unexpected signing alias")

          key = Path(os.environ["RUNNER_TEMP"]) / "biod-signing.p12"
          key.write_bytes(base64.b64decode(data["keystore"], validate=True))
          key.chmod(0o600)

          print(f"::add-mask::{password}")

          version = 1000 + int(os.environ["GITHUB_RUN_NUMBER"])

          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"BIO_D_KEYSTORE={key}\n")
              output.write(f"BIO_D_KEY_PASSWORD={password}\n")
              output.write(f"BIO_D_VERSION_CODE={version}\n")
          PY

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk \
            apk/BIO-D-Sales.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIO-D-Sales-APK
          path: apk/BIO-D-Sales.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/biod-signing.p12"
