name: Build BIO-D APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      BIO_D_VERSION_CODE: ${{ 2000 + github.run_number }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("BIO-D-Android.zip")
          destination = Path("android-project").resolve()

          if not archive.is_file():
              raise RuntimeError(
                  "Upload BIO-D-Android.zip to the repository first."
              )

          destination.mkdir(exist_ok=True)

          with zipfile.ZipFile(archive) as package:
              for item in package.infolist():
                  target = (destination / item.filename).resolve()
                  if not target.is_relative_to(destination):
                      raise RuntimeError("Invalid archive path")
              package.extractall(destination)

          if not (destination / "app" / "build.gradle").is_file():
              raise RuntimeError(
                  "Use BIO-D-Android.zip from the latest update."
              )
          PY

      - name: Prepare permanent signing key
        shell: bash
        env:
          BIO_D_SIGNING: ${{ secrets.BIO_D_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("BIO_D_SIGNING", "").strip()

          if not raw:
              raise RuntimeError(
                  "Add BIO_D_SIGNING to repository Actions secrets first."
              )

          try:
              config = json.loads(raw)
              password = config["password"]
              keystore = base64.b64decode(
                  config["keystore"], validate=True
              )
              if config.get("alias", "biod") != "biod":
                  raise ValueError("Unexpected key alias")
              if not isinstance(password, str) or not password:
                  raise ValueError("Missing password")
              if "\n" in password or "\r" in password:
                  raise ValueError("Unsupported password format")
              if not keystore:
                  raise ValueError("Empty keystore")
          except Exception:
              raise RuntimeError(
                  "BIO_D_SIGNING is invalid. Use the original signing secret."
              ) from None

          key_path = Path(os.environ["RUNNER_TEMP"]) / "biod-signing.p12"
          key_path.write_bytes(keystore)
          key_path.chmod(0o600)

          escaped = (
              password.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print("::add-mask::" + escaped)

          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"BIO_D_KEYSTORE={key_path}\n")
              output.write(f"BIO_D_KEY_PASSWORD={password}\n")
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK was not found."
            exit 1
          fi

          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDK_MANAGER" ]; then
            echo "sdkmanager was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          set +o pipefail
          yes | "$SDK_MANAGER" --licenses > /dev/null
          LICENSE_RESULT=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_RESULT" -ne 0 ]; then
            echo "Android SDK license setup failed."
            exit "$LICENSE_RESULT"
          fi

          "$SDK_MANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Build signed APK
        working-directory: android-project
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --console=plain \
            :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android-project/app/build/outputs/apk/release/app-release.apk

      - name: Prepare download
        shell: bash
        run: |
          mkdir -p download

          cp \
            android-project/app/build/outputs/apk/release/app-release.apk \
            download/BIO-D-Sales.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIO-D-Sales-APK
          path: download/BIO-D-Sales.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/biod-signing.p12"
