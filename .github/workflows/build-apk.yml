name: Build BIO-D APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - BIO-D-Android.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive_path = Path("BIO-D-Android.zip")
          if not archive_path.is_file():
              raise FileNotFoundError(
                  "Upload BIO-D-Android.zip to the repository root first"
              )

          root = Path("android").resolve()
          root.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive_path) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError("Invalid archive path")

              archive.extractall(root)

          if not (root / "settings.gradle").is_file():
              raise FileNotFoundError("Android project files are missing")

          print("Android project extracted successfully")
          PY

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIO-D-Sales-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
